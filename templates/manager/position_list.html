{% extends "base.html" %}

{% block content %}
<h1 class="mb-3">Positions</h1>

<a href="{% url 'manager:position-create' %}" class="btn btn-primary mb-3">Create Position</a>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Name</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        {% for position in position_list %}
            <tr>
                <td><a href="{% url 'manager:position-detail' position.pk %}">{{ position.name }}</a></td>
                <td>
                    <a href="{% url 'manager:position-update' position.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'manager:position-delete' position.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2" class="text-center">No positions yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
