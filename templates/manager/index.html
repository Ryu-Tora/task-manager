{% extends "base.html" %}

{% block content %}
<h1 class="mb-4 text-center">Task Manager Dashboard</h1>

<div class="row text-center">
    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>{{ num_tasks }}</h4>
            <p class="text-muted">Tasks</p>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>{{ num_workers }}</h4>
            <p class="text-muted">Workers</p>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card p-3">
            <h4>{{ num_positions }}</h4>
            <p class="text-muted">Positions</p>
        </div>
    </div>
</div>

<p class="text-center mt-4">
    You have visited this page {{ num_visits }} time{{ num_visits|pluralize }}.
</p>

{% endblock %}
