{% extends "base.html" %}

{% block content %}
<h2 class="fw-bold mb-3">{{ view.object|default:"Create Task" }}</h2>

<div class="card shadow-sm p-4">
    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'manager:task-list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
