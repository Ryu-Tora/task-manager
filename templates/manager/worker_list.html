{% extends "base.html" %}

{% block content %}
<h1 class="mb-3">Workers</h1>

<a href="{% url 'manager:worker-create' %}" class="btn btn-primary mb-3">Create Worker</a>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Username</th>
            <th>Position</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        {% for worker in worker_list %}
            <tr>
                <td><a href="{% url 'manager:worker-detail' worker.pk %}">{{ worker.username }}</a></td>
                <td>{{ worker.position }}</td>
                <td>
                    <a href="{% url 'manager:worker-update' worker.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'manager:worker-delete' worker.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3" class="text-center">No workers yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
