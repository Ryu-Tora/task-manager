{% extends "base.html" %}

{% block content %}
<h1>Delete Task Type</h1>

<p>Are you sure you want to delete "{{ object }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'manager:task-type-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
