{% extends "base.html" %}

{% block content %}
<h1 class="mb-3">Task Types</h1>

<a href="{% url 'manager:task-type-create' %}" class="btn btn-primary mb-3">Create Task Type</a>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Name</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        {% for type in task_type_list %}
            <tr>
                <td>{{ type.name }}</td>
                <td>
                    <a href="{% url 'manager:task-type-update' type.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'manager:task-type-delete' type.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2" class="text-center">No task types yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
